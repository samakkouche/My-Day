<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Day">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>My Day</title>
<style>
:root{--bg:#f4f6f9;--fg:#18212b;--mut:#6b7885;--card:#fff;--ln:#e1e6ec;--ac:#2f7de1;--red:#d93a3a;--ok:#2e9d62;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--fg:#e8eef5;--mut:#8c9aa8;--card:#18232f;--ln:#26333f;--ac:#5aa0ff;--red:#ff6b6b;--ok:#4cc88a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--fg:#e8eef5;--mut:#8c9aa8;--card:#18232f;--ln:#26333f;--ac:#5aa0ff;--red:#ff6b6b;--ok:#4cc88a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
#tabs{display:flex}
#tabs button{flex:1;background:none;border:none;border-radius:0;outline:none;-webkit-appearance:none;appearance:none;color:var(--mut);font-family:inherit;font-weight:600;font-size:16px;padding:14px 0 10px}
#tabs span{display:inline-block;padding-bottom:6px;border-bottom:3px solid transparent}
#tabs button.on{color:var(--ac)}#tabs button.on span{border-bottom-color:var(--ac)}
#pg{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#pg::-webkit-scrollbar{display:none}
section{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:14px 16px 110px}
h2{margin:0 0 12px;font-size:22px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:9px 13px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.it,.hc{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.it{display:flex;gap:12px;align-items:center}
.ck{width:30px;height:30px;border-radius:50%;padding:0;flex:none;font-size:16px;line-height:1}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tx{flex:1;min-width:0}.t{display:block;font-size:17px;word-break:break-word}.d{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.red{color:var(--red)!important;font-weight:600}.done .t{text-decoration:line-through;color:var(--mut)}
.x{border:none;background:none;color:var(--mut);padding:6px}
.m{color:var(--mut);font-size:14px}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:17px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dy{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:12px;color:var(--mut)}
.dy i{font-style:normal;width:34px;height:34px;border-radius:50%;border:2px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
.dy.on i{background:var(--ok);border-color:var(--ok)}.dy.td{color:var(--ac);font-weight:700}
.nav{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;font-size:32px;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
#sh.o{display:flex}
#sb{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#sb h3{margin:0}label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--mut)}
input{font:inherit;font-size:17px;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
.row2{display:flex;gap:10px}.row2 button{flex:1}
.sg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.sg button{padding:8px 0;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center;line-height:1.2}
.sg b{font-size:12px;color:var(--ac)}
svg{width:100%;display:block;background:var(--card);border:1px solid var(--ln);border-radius:14px}
.bn{background:var(--card);border:1px dashed var(--ln);border-radius:12px;padding:10px;margin-bottom:12px;font-size:14px;color:var(--mut)}
:root:root:root{--bg:#000;--fg:#f2f2f2;--mut:#8c8c8c;--card:#131313;--ln:#2c2c2c;--ac:#f2f2f2;--ok:#f2f2f2;--red:#ff5a5a;color-scheme:dark}
button.p,.ck.on,.dy i,.fab{color:#000}.fab{box-shadow:0 6px 18px rgba(255,255,255,.1)}#sh{background:rgba(0,0,0,.7)}
#sb{max-width:100vw;overflow:hidden}#sb label.f{min-width:0;width:100%}
input{display:block;min-width:0;max-width:100%;min-height:46px;-webkit-appearance:none;appearance:none;text-align:left}
input::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
html,body{overflow-x:hidden}
</style>
</head>
<body>
<div id="app">
<div id="tabs"><button class="on" data-p="0"><span>To-do</span></button><button data-p="1"><span>Habits</span></button><button data-p="2"><span>Sleep</span></button></div>
<div id="pg"><section id="s0"></section><section id="s1"></section><section id="s2"></section></div>
</div>
<button class="fab p" id="fab">+</button>
<div id="sh"><div id="sb"></div></div>
<script>
var K="myday-v1",D={todos:[],habits:[],sleep:{},nt:{}};
try{var raw=localStorage.getItem(K);if(raw)D=Object.assign(D,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
var $=function(q){return document.querySelector(q)},W={h:0,s:0},DN=["M","T","W","T","F","S","S"];
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function diff(s){return Math.round((pd(s)-today())/864e5)}
function sd(s){return pd(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
function week(o){var t=today(),m=(t.getDay()+6)%7,a=[];for(var i=0;i<7;i++)a.push(new Date(t.getFullYear(),t.getMonth(),t.getDate()-m+o*7+i));return a}
function wl(o){var w=week(o);return w[0].toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" – "+w[6].toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function hm(m){return Math.floor(m/60)+"h "+pad(m%60)+"m"}
function slp(e){var a=e.bed.split(":"),b=e.wake.split(":");return ((+b[0]*60+ +b[1])-(+a[0]*60+ +a[1])+1440)%1440}
function dueLbl(s){var n=diff(s);return n<0?"Overdue · "+sd(s):n===0?"Due today":n===1?"Due tomorrow":"Due "+sd(s)}
function soon(t){return !t.done&&t.due&&diff(t.due)<=1}
function rT(){
 var L=D.todos.slice().sort(function(a,b){return (a.done-b.done)||((a.due||"9")>(b.due||"9")?1:-1)});
 var bn="";if("Notification" in window&&Notification.permission==="default")bn='<div class="bn">Get a heads-up when something is due within a day. <button data-a="notif" style="margin-top:8px">Turn on notifications</button></div>';
 $("#s0").innerHTML="<h2>To-do</h2>"+bn+(L.length?L.map(function(t){var r=soon(t)?" red":"";return '<div class="it'+(t.done?" done":"")+'"><button class="ck'+(t.done?" on":"")+'" data-a="tk" data-i="'+t.id+'">'+(t.done?"✓":"")+'</button><div class="tx"><span class="t'+r+'">'+esc(t.t)+"</span>"+(t.due?'<span class="d'+(t.done?"":r)+'">'+dueLbl(t.due)+"</span>":"")+'</div><button class="x" data-a="td" data-i="'+t.id+'">✕</button></div>'}).join(""):'<p class="m">Nothing here yet. Tap + to add something.</p>');
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nav(k){return '<div class="nav"><button data-a="wk" data-k="'+k+'" data-v="-1">‹</button><b>'+wl(W[k])+'</b><button data-a="wk" data-k="'+k+'" data-v="1">›</button></div>'}
function rH(){
 var w=week(W.h),t=ymd(today());
 $("#s1").innerHTML="<h2>Habits</h2>"+nav("h")+(D.habits.length?D.habits.map(function(h){var n=w.filter(function(d){return h.days[ymd(d)]}).length;
  return '<div class="hc"><div class="hh"><span>'+esc(h.n)+' <span class="m">'+n+'/7</span></span><button class="x" data-a="hd" data-i="'+h.id+'">✕</button></div><div class="wk">'+w.map(function(d,i){var k=ymd(d);return '<button class="dy'+(h.days[k]?" on":"")+(k===t?" td":"")+'" style="border:none;background:none" data-a="hk" data-i="'+h.id+'" data-d="'+k+'">'+DN[i]+"<i>"+(h.days[k]?"✓":"")+"</i>"+d.getDate()+"</button>"}).join("")+"</div></div>"}).join(""):'<p class="m">No habits yet. Tap + to add gym, reading, anything.</p>');
}
function rS(){
 var w=week(W.s),P=[],tot=0,c=0,mx=12,RH=46,T=22;
 w.forEach(function(d,i){var e=D.sleep[ymd(d)];if(e){var m=slp(e);P.push({i:i,m:m});tot+=m;c++;mx=Math.max(mx,Math.ceil(m/60))}});
 var X=function(m){return 50+(m/60/mx)*285},Y=function(i){return T+i*RH+RH/2};
 var g="";[0,1,2,3].forEach(function(k){var hh=Math.round(mx*k/3),x=50+(hh/mx)*285;g+='<line x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(T+7*RH)+'" stroke="var(--ln)"/><text x="'+x+'" y="14" font-size="10" fill="var(--mut)" text-anchor="middle">'+hh+"h</text>"});
 w.forEach(function(d,i){g+='<text x="4" y="'+(Y(i)-2)+'" font-size="12" font-weight="700" fill="var(--fg)">'+DN[i]+'</text><text x="4" y="'+(Y(i)+11)+'" font-size="10" fill="var(--mut)">'+d.getDate()+"</text>"});
 var ln=P.length>1?'<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="'+P.map(function(p){return X(p.m)+","+Y(p.i)}).join(" ")+'"/>':"";
 var dots=P.map(function(p){var x=X(p.m),r=x>250;return '<circle cx="'+x+'" cy="'+Y(p.i)+'" r="6" fill="var(--ac)"/><text x="'+(r?x-11:x+11)+'" y="'+(Y(p.i)+4)+'" font-size="11" fill="var(--fg)" text-anchor="'+(r?"end":"start")+'">'+hm(p.m)+"</text>"}).join("");
 var days=w.map(function(d,i){var k=ymd(d),e=D.sleep[k];return '<button data-a="sl" data-d="'+k+'">'+DN[i]+'<span class="m">'+d.getDate()+"</span>"+(e?"<b>"+hm(slp(e))+"</b>":'<span class="m">+</span>')+"</button>"}).join("");
 $("#s2").innerHTML="<h2>Sleep</h2>"+nav("s")+'<div class="sg">'+days+'</div><svg style="margin-top:14px" viewBox="0 0 350 '+(T+7*RH+8)+'">'+g+ln+dots+"</svg>"+(c?'<p class="m" style="margin-top:14px">Average this week: <b>'+hm(Math.round(tot/c))+"</b> over "+c+" night"+(c>1?"s":"")+"</p>":'<p class="m" style="margin-top:14px">Tap a day above to add when you went to sleep and woke up.</p>');
}
function all(){rT();rH();rS();badge()}
function open(h){$("#sb").innerHTML=h;$("#sh").classList.add("o")}
function close(){$("#sh").classList.remove("o")}
function sheet(k,d){
 if(k==="t")open('<h3>New to-do</h3><label class="f">What needs doing<input id="i1" maxlength="120"></label><label class="f">Needed by (optional)<input id="i2" type="date"></label><div class="row2"><button data-a="x">Cancel</button><button class="p" data-a="addT">Add</button></div>');
 else if(k==="h")open('<h3>New habit</h3><label class="f">Habit<input id="i1" maxlength="60" placeholder="Gym, reading…"></label><div class="row2"><button data-a="x">Cancel</button><button class="p" data-a="addH">Add</button></div>');
 else{var e=D.sleep[d]||{bed:"23:00",wake:"07:00"};open('<h3>Sleep · '+sd(d)+'</h3><label class="f">Went to sleep<input id="i1" type="time" value="'+e.bed+'"></label><label class="f">Woke up<input id="i2" type="time" value="'+e.wake+'"></label><div class="row2"><button data-a="x">Cancel</button>'+(D.sleep[d]?'<button data-a="clr" data-d="'+d+'">Clear</button>':"")+'<button class="p" data-a="svS" data-d="'+d+'">Save</button></div>')}
 var f=$("#i1");if(f&&f.type==="text")setTimeout(function(){f.focus()},50);
}
var pg=$("#pg"),cur=0;
function go(i){pg.scrollTo({left:i*pg.clientWidth,behavior:"smooth"})}
pg.addEventListener("scroll",function(){var i=Math.round(pg.scrollLeft/pg.clientWidth);if(i===cur)return;cur=i;[].forEach.call(document.querySelectorAll("#tabs button"),function(b,j){b.classList.toggle("on",j===i)});$("#fab").style.display=i<2?"":"none"});
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-a],[data-p],#fab");if(!el)return;
 if(el.id==="fab"){sheet(cur===0?"t":"h");return}
 if(el.dataset.p!==undefined){go(+el.dataset.p);return}
 var a=el.dataset.a,i=el.dataset.i,d=el.dataset.d;
 if(a==="x"){close();return}
 if(a==="tk"){D.todos.forEach(function(t){if(t.id===i)t.done=!t.done})}
 else if(a==="td"){D.todos=D.todos.filter(function(t){return t.id!==i})}
 else if(a==="hd"){D.habits=D.habits.filter(function(h){return h.id!==i})}
 else if(a==="hk"){D.habits.forEach(function(h){if(h.id===i){if(h.days[d])delete h.days[d];else h.days[d]=1}})}
 else if(a==="wk"){W[el.dataset.k]+=+el.dataset.v}
 else if(a==="sl"){sheet("s",d);return}
 else if(a==="addT"){var v=$("#i1").value.trim();if(!v)return;D.todos.push({id:id(),t:v,due:$("#i2").value||"",done:false});close()}
 else if(a==="addH"){var n=$("#i1").value.trim();if(!n)return;D.habits.push({id:id(),n:n,days:{}});close()}
 else if(a==="svS"){var b=$("#i1").value,wk=$("#i2").value;if(!b||!wk)return;D.sleep[d]={bed:b,wake:wk};close()}
 else if(a==="clr"){delete D.sleep[d];close()}
 else if(a==="notif"){try{Notification.requestPermission().then(function(){all();ping()})}catch(x){}return}
 else return;
 save();all();ping();
});
$("#sh").addEventListener("click",function(e){if(e.target.id==="sh")close()});
function badge(){var n=D.todos.filter(soon).length;try{if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}}
function ping(){
 try{var n=D.todos.filter(soon);if(!n.length||!("Notification" in window)||Notification.permission!=="granted")return;
 var k=ymd(today()),f=n.filter(function(t){return D.nt[t.id]!==k});if(!f.length)return;
 f.forEach(function(t){D.nt[t.id]=k});save();
 var ti=f.length+" to-do"+(f.length>1?"s":"")+" due within a day",o={body:f.map(function(t){return t.t}).join(", ")};
 if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(function(r){r.showNotification(ti,o)});else new Notification(ti,o)}catch(e){}
}
document.addEventListener("visibilitychange",function(){if(!document.hidden){all();ping()}});
all();ping();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
