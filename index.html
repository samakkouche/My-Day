<style>
:root{--bg:#f4f6f9;--fg:#18212b;--mut:#6b7885;--card:#fff;--ln:#e1e6ec;--ac:#2f7de1;--red:#d93a3a;--ok:#2e9d62;

#pg{flex:1;min-height:0;display:flex;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}

.tx{flex:1;min-width:0}.t{display:block;font-size:17px;word-break:break-word}.d{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.red{color:var(--red)!important;font-weight:600}.done .t{text-decoration:line-through;color:var(--mut)}

#sb h3{margin:0}label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--mut)}
input{font:inherit;font-size:17px;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
.row2{display:flex;gap:10px}.row2 button{flex:1}
.sg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.sg button{padding:8px 0;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center;line-height:1.2}
.sg b{font-size:12px;color:var(--ac)}
svg{width:100%;display:block;background:var(--card);border:1px solid var(--ln);border-radius:14px}
.bn{background:var(--card);border:1px dashed var(--ln);border-radius:12px;padding:10px;margin-bottom:12px;font-size:14px;color:var(--mut)}
:root:root:root{--bg:#000;--fg:#f2f2f2;--mut:#8c8c8c;--card:#131313;--ln:#2c2c2c;--ac:#f2f2f2;--ok:#f2f2f2;--red:#ff5a5a;color-scheme:dark}
button.p,.ck.on,.dy i,.fab{color:#000}.fab{box-shadow:0 6px 18px rgba(255,255,255,.1)}#sh{background:rgba(0,0,0,.7)}
#sb{max-width:100vw;overflow:hidden}#sb label.f{min-width:0;width:100%}
input{display:block;min-width:0;max-width:100%;min-height:46px;-webkit-appearance:none;appearance:none;text-align:left}
input::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
html,body{overflow-x:hidden}
.sg button.td{background:rgba(255,255,255,.14)}
.ttl{display:flex;justify-content:space-between;align-items:center;min-height:26px;margin:0 0 12px}.ttl h2{margin:0}.sm{padding:4px 11px;font-size:13px;line-height:1.2;border-radius:99px}
#cbtn{position:fixed;left:20px;bottom:calc(66px + env(safe-area-inset-bottom,0px));padding:9px 14px;font-size:14px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#cv{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:15;display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}#cv.o{display:flex}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}#cl{flex:1;overflow-y:auto}.ci{cursor:pointer}.ci.sl{background:rgba(255,255,255,.14);border-color:var(--fg)}
#dlg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}#dlg.o{display:flex}
#db{width:100%;max-width:340px;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}#db h3{margin:0}
body,button,input{touch-action:manipulation}section{touch-action:pan-y}
#sw{position:fixed;left:0;right:0;bottom:0;height:calc(44px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center;gap:4px;background:linear-gradient(rgba(0,0,0,0),var(--bg) 45%);touch-action:none;z-index:10}
#sw b{padding:14px 9px}#sw i{display:block;width:8px;height:8px;border-radius:50%;background:var(--ln)}#sw b.on i{background:var(--fg)}
section{touch-action:pan-y}#cl{touch-action:pan-y}
.sr{position:relative;border-radius:14px;margin-bottom:10px;overflow:hidden}.sr .it{margin-bottom:0;position:relative}
.bg{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 20px;font-weight:600;color:#fff}
.bg.l{left:0;right:50%;background:#444;justify-content:flex-start}.bg.r{right:0;left:50%;background:#c93a3a;justify-content:flex-end}
span.ck{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ok);color:#000}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border-radius:99px;padding:8px 14px}.chip.sl{background:var(--fg);color:#000;border-color:var(--fg)}
.ab{display:flex;gap:8px}.ab input{flex:1}
select{font:inherit;font-size:17px;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%;min-height:46px}
.dy small{font-size:10px;line-height:1.1;min-height:11px;text-align:center;color:var(--mut);word-break:break-word}
.hn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#fjs{margin-top:-4px}
@keyframes inL{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}@keyframes inR{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
.aL>*:not(.ttl){animation:inL .28s ease}.aR>*:not(.ttl){animation:inR .28s ease}
.dh{padding:8px 10px;color:var(--mut);font-size:22px;line-height:1;touch-action:none;-webkit-user-select:none;user-select:none}
.hr{display:flex;align-items:center}.dragging{z-index:5;box-shadow:0 10px 28px rgba(0,0,0,.75);position:relative;will-change:transform}
.bh{display:flex;justify-content:space-between;align-items:center}
.bl{max-height:min(280px,38vh);flex:none;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;border:1px solid var(--ln);border-radius:12px}
.bkr{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 4px 14px;border-bottom:1px solid var(--ln);font-size:17px;cursor:pointer}.bkr:last-child{border-bottom:none}
.bkr.sl{background:rgba(255,255,255,.14);font-weight:600}.bkr.sl span::after{content:" ✓"}
</style>

<body>
<div id="app">
<div id="tabs"><button class="on" data-p="0"><span>To-do</span></button><button data-p="1"><span>Habits</span></button><button data-p="2"><span>Sleep</span></button></div>
<div id="pg"><section id="s0"></section><section id="s1"></section><section id="s2"></section></div>
</div>
<button class="fab p" id="fab">+</button>
<button id="cbtn">Completed</button>
<div id="cv"></div>
<div id="sh"><div id="sb"></div></div>
<div id="dlg"><div id="db"></div></div>
<div id="sw"><b class="on" data-p="0"><i></i></b><b data-p="1"><i></i></b><b data-p="2"><i></i></b></div>
<script>
var K="myday-v1",D={todos:[],habits:[],sleep:{},nt:{},books:[]};
try{var raw=localStorage.getItem(K);if(raw)D=Object.assign(D,JSON.parse(raw))}catch(e){}
D.habits.forEach(function(h){h.kind=kd(h.n,"")});
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
var $=function(q){return document.querySelector(q)},W={h:0,s:0},DN=["M","T","W","T","F","S","S"],MU=["Chest","Back","Legs","Shoulders","Biceps","Triceps"],SEL={g:{},b:-1},RD={};
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function diff(s){return Math.round((pd(s)-today())/864e5)}
function sd(s){return pd(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
function week(o){var t=today(),m=(t.getDay()+6)%7,a=[];for(var i=0;i<7;i++)a.push(new Date(t.getFullYear(),t.getMonth(),t.getDate()-m+o*7+i));return a}
function wl(o){var w=week(o);return w[0].toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" – "+w[6].toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function hm(m){return Math.floor(m/60)+"h "+pad(m%60)+"m"}
function slp(e){var a=e.bed.split(":"),b=e.wake.split(":");return Math.max(0,((+b[0]*60+ +b[1])-(+a[0]*60+ +a[1])+1440)%1440-(e.fj?(e.fm||0):0))}
function dueLbl(s){var n=diff(s);return n<0?"Overdue · "+sd(s):n===0?"Due today":n===1?"Due tomorrow":"Due "+sd(s)}
function soon(t){return !t.done&&t.due&&diff(t.due)<=1}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hab(i){return D.habits.filter(function(x){return x.id===i})[0]}
function kd(n,s){return s||(/gym/i.test(n)?"gym":(/^\s*(read|reading)\s*$/i.test(n)||/\bbooks?\b/i.test(n))?"reading":"")}
function row(t,c){var r=c==="t"&&soon(t)?" red":"";
 return '<div class="sr'+(c==="t"?" dr":"")+'" data-i="'+t.id+'"><div class="bg l">'+(c==="t"?"Edit":"Restore")+'</div><div class="bg r">Delete</div><div class="it sw" data-c="'+c+'" data-i="'+t.id+'">'+(c==="t"?'<button class="ck" data-a="tk" data-i="'+t.id+'"></button>':'<span class="ck on">✓</span>')+'<div class="tx"><span class="t'+r+'">'+esc(t.t)+'</span>'+(c==="t"?(t.due?'<span class="d'+r+'">'+dueLbl(t.due)+'</span>':""):'<span class="d">'+(t.doneAt?"Completed "+sd(t.doneAt):"Completed")+'</span>')+'</div>'+(c==="t"?'<span class="dh">≡</span><button class="x" data-a="td" data-i="'+t.id+'">✕</button>':"")+'</div></div>'}
function rT(){
 var L=D.todos.filter(function(t){return !t.done});
 var bn="";if("Notification" in window&&Notification.permission==="default")bn='<div class="bn">Get a heads-up when something is due within a day. <button data-a="notif" style="margin-top:8px">Turn on notifications</button></div>';
 $("#s0").innerHTML="<h2>To-do</h2>"+bn+(L.length?L.map(function(t){return row(t,"t")}).join("")+'<p class="m">Swipe right to edit, left to delete. Drag ≡ to reorder.</p>':'<p class="m">Nothing here yet. Tap + to add something.</p>');
}
function ttl(t,k){return '<div class="ttl"><h2>'+t+'</h2>'+(W[k]?'<button class="sm" data-a="tw" data-k="'+k+'">This week</button>':'')+'</div>'}
function nav(k){return '<div class="nav"><button data-a="wk" data-k="'+k+'" data-v="-1">‹</button><b>'+wl(W[k])+'</b><button data-a="wk" data-k="'+k+'" data-v="1">›</button></div>'}
function sld(k,d){var s=$(k==="h"?"#s1":"#s2");s.classList.remove("aL","aR");void s.offsetWidth;s.classList.add(d>0?"aL":"aR");setTimeout(function(){s.classList.remove("aL","aR")},320)}
function rH(){
 var w=week(W.h),t=ymd(today());
 $("#s1").innerHTML=ttl("Habits","h")+nav("h")+(D.habits.length?D.habits.map(function(h){var n=w.filter(function(d){return h.days[ymd(d)]}).length;
  return '<div class="hc dr" data-i="'+h.id+'"><div class="hh"><span><span class="hn" data-i="'+h.id+'">'+esc(h.n)+'</span> <span class="m">'+n+'/7</span></span><span class="hr"><span class="dh">≡</span><button class="x" data-a="hd" data-i="'+h.id+'">✕</button></span></div><div class="wk">'+w.map(function(d,i){var k=ymd(d),sb="";
   return '<button class="dy'+(h.days[k]?" on":"")+(k===t?" td":"")+'" style="border:none;border-radius:12px;background:'+(k===t?"rgba(255,255,255,.14)":"none")+'" data-a="hk" data-i="'+h.id+'" data-d="'+k+'">'+DN[i]+"<i>"+(h.days[k]?"✓":"")+"</i>"+d.getDate()+"</button>"}).join("")+"</div></div>"}).join("")+'<p class="m">Hold a habit name to edit it. Drag ≡ to reorder.</p>':'<p class="m">No habits yet. Tap + to add gym, reading, anything.</p>');
}
function rS(){
 var w=week(W.s),P=[],tot=0,c=0,mx=12,RH=46,T=22;
 w.forEach(function(d,i){var e=D.sleep[ymd(d)];if(e){var m=slp(e);P.push({i:i,m:m,f:e.fj});tot+=m;c++;mx=Math.max(mx,Math.ceil(m/60))}});
 var X=function(m){return 50+(m/60/mx)*285},Y=function(i){return T+i*RH+RH/2};
 var g="";w.forEach(function(d,i){if(ymd(d)===ymd(today()))g+='<rect x="0" y="'+(T+i*RH)+'" width="350" height="'+RH+'" fill="rgba(255,255,255,.1)"/>'});[0,1,2,3].forEach(function(k){var hh=Math.round(mx*k/3),x=50+(hh/mx)*285;g+='<line x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(T+7*RH)+'" stroke="var(--ln)"/><text x="'+x+'" y="14" font-size="10" fill="var(--mut)" text-anchor="middle">'+hh+"h</text>"});
 w.forEach(function(d,i){g+='<text x="4" y="'+(Y(i)-2)+'" font-size="12" font-weight="700" fill="var(--fg)">'+DN[i]+'</text><text x="4" y="'+(Y(i)+11)+'" font-size="10" fill="var(--mut)">'+d.getDate()+"</text>"});
 var ln=P.length>1?'<polyline fill="none" stroke="var(--mut)" stroke-width="2.5" points="'+P.map(function(p){return X(p.m)+","+Y(p.i)}).join(" ")+'"/>':"";
 var dots=P.map(function(p){var x=X(p.m),r=x>250;return '<circle cx="'+x+'" cy="'+Y(p.i)+'" r="6" fill="'+(p.f?"#4cd27a":"#fff")+'"/><text x="'+(r?x-11:x+11)+'" y="'+(Y(p.i)+4)+'" font-size="11" fill="var(--fg)" text-anchor="'+(r?"end":"start")+'">'+hm(p.m)+"</text>"}).join("");
 var days=w.map(function(d,i){var k=ymd(d),e=D.sleep[k];return '<button'+(k===ymd(today())?' class="td"':'')+' data-a="sl" data-d="'+k+'">'+DN[i]+'<span class="m">'+d.getDate()+"</span>"+(e?"<b>"+hm(slp(e))+"</b>":'<span class="m">+</span>')+"</button>"}).join("");
 $("#s2").innerHTML=ttl("Sleep","s")+nav("s")+'<div class="sg">'+days+'</div><svg style="margin-top:14px" viewBox="0 0 350 '+(T+7*RH+8)+'">'+g+ln+dots+'</svg><p class="m" style="margin:10px 0 0"><span style="color:#4cd27a">●</span> Woke for Fajr &nbsp; <span style="color:#fff">●</span> No Fajr</p>'+(c?'<p class="m" style="margin-top:10px">Average this week: <b>'+hm(Math.round(tot/c))+"</b> over "+c+" night"+(c>1?"s":"")+"</p>":'<p class="m" style="margin-top:10px">Tap a day above to add when you went to sleep and woke up.</p>');
}
function rC(){var L=D.todos.filter(function(t){return t.done}).sort(function(a,b){return (b.doneAt||"")>(a.doneAt||"")?1:-1});
 $("#cv").innerHTML='<h2 style="margin:0 0 12px">Completed</h2><div id="cl">'+(L.length?L.map(function(t){return row(t,"c")}).join("")+'<p class="m">Swipe right to restore, left to delete.</p>':'<p class="m">Nothing completed yet.</p>')+'</div><button class="p" data-a="cvc" style="width:100%;margin-top:12px">Close</button>'}
function showC(){rC();$("#cv").classList.add("o")}
function ask(h){$("#db").innerHTML=h;$("#dlg").classList.add("o")}
function closeD(){$("#dlg").classList.remove("o")}
function all(){rT();rH();rS();badge();if($("#cv").classList.contains("o"))rC()}
function open(h){$("#sb").innerHTML=h;$("#sh").classList.add("o")}
function close(){$("#sh").classList.remove("o")}
function delT(i,c){var t=D.todos.filter(function(x){return x.id===i})[0];if(!t)return;ask('<h3>'+(c?"Delete forever?":"Delete to-do?")+'</h3><p class="m" style="margin:0;font-size:16px">Are you sure you want to delete “'+esc(t.t)+'”?</p><div class="row2"><button data-a="x">Cancel</button><button class="p" data-a="tdc" data-i="'+i+'">Delete</button></div>')}
function restore(i){D.todos.forEach(function(t){if(t.id===i){t.done=false;delete t.doneAt}});save();all();ping()}
function rowAct(r,dir){var c=r.dataset.c,i=r.dataset.i;if(c==="t"){dir<0?delT(i):sheet("e",null,i)}else{dir<0?delT(i,1):restore(i)}}
function sheet(k,d,hid,keep){
 var h,t;
 if(k==="t"||k==="e"){t=k==="e"?D.todos.filter(function(x){return x.id===hid})[0]:{t:"",due:""};if(!t)return;
  open('<h3>'+(k==="e"?"Edit to-do":"New to-do")+'</h3><label class="f">What needs doing<input id="i1" maxlength="120" value="'+esc(t.t)+'"></label><label class="f">Needed by (optional)<input id="i2" type="date" value="'+(t.due||"")+'"></label><div class="row2"><button data-a="x">Cancel</button><button class="p" data-a="'+(k==="e"?"svE":"addT")+'" data-i="'+(hid||"")+'">'+(k==="e"?"Save":"Add")+'</button></div>')}
 else if(k==="h"||k==="he"){h=k==="he"?hab(hid):{n:"",kind:""};if(!h)return;SEL.t=h.kind||"";
